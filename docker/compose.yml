# Dev stack. From backend/:  docker compose -f docker/compose.yml up --build
name: hrms

x-app: &app
  build:
    context: ../..
    dockerfile: backend/docker/Dockerfile
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+asyncpg://hrms_api:hrms_api_dev@postgres:5432/hrms
    PLATFORM_DATABASE_URL: postgresql+asyncpg://hrms_admin:hrms_admin_dev@postgres:5432/hrms
    MIGRATION_DATABASE_URL: postgresql+psycopg://hrms_owner:hrms_owner_dev@postgres:5432/hrms
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://minio:9000
  volumes:
    - ../:/srv/backend
    - ../../database:/srv/database:ro

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms_owner          # owns the tables; RLS does not apply to it
      POSTGRES_PASSWORD: hrms_owner_dev
      HRMS_API_PASSWORD: hrms_api_dev
      HRMS_ADMIN_PASSWORD: hrms_admin_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms_owner -d hrms"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    command: arq app.workers.settings.WorkerSettings --watch app
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
