# Production reverse proxy (M11). Wildcard cert via Let's Encrypt DNS-01.
server {
    listen 443 ssl http2;
    server_name myhrm.example *.myhrm.example;

    ssl_certificate     /etc/letsencrypt/live/myhrm.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myhrm.example/privkey.pem;

    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /metrics { deny all; }
}

server {
    listen 80;
    server_name myhrm.example *.myhrm.example;
    return 301 https://$host$request_uri;
}
